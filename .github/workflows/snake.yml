name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: zachrrd
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-green
            dist/github-contribution-grid-snake-dark.svg?palette=github-green&color_snake=4C7F68

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
